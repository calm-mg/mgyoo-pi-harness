name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Check source and build
        run: npm run check && npm run build
      - name: Exercise POSIX installer plan
        if: runner.os != 'Windows'
        run: MGYOO_PI_DRY_RUN=1 sh ./install.sh
      - name: Exercise Windows installer plan
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $env:MGYOO_PI_DRY_RUN = "1"
          ./install.ps1

  container-boundary:
    name: Container boundary
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Verify safe-mode host boundary
        run: sh ./tests/container/smoke.sh
