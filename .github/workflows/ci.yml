name: CI

on:
  push:
    branches: ["main"]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
      - name: Install exact dependencies
        run: npm ci --ignore-scripts
      - name: Check source and test
        run: npm run check
      - name: Run bootstrap and CLI
        shell: bash
        if: runner.os != 'Windows'
        run: |
          sh install.sh
          "$HOME/.local/bin/harness" setup pi --dry-run
      - name: Run Windows bootstrap and CLI
        shell: pwsh
        if: runner.os == 'Windows'
        run: |
          ./install.ps1
          & "$env:LOCALAPPDATA\mgyoo-harness\bin\harness.cmd" setup pi --dry-run

  container-boundary:
    name: Container boundary (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
      - name: Verify safe-mode host boundary
        run: sh ./tests/container/smoke.sh
